<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebSVG</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>WebSVG</h1>
      <span id="status">Loading…</span>

  </header>

  <main id="workspace" aria-label="WebSVG documents"></main>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
