<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebSVG</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>WebSVG</h1>
      <p id="status">Loading input…</p>
    </div>
    <button id="clear-selection" type="button">Clear selection</button>
  </header>

  <main>
    <aside>
      <section>
        <h2>Documents</h2>
        <div id="documents"></div>
      </section>

      <section>
        <h2>Semantics</h2>
        <div id="semantics"></div>
      </section>

      <section>
        <h2>Selection</h2>
        <pre id="selection">none</pre>
      </section>
    </aside>

    <section id="workspace" aria-label="SVG workspace"></section>
  </main>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
